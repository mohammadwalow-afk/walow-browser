<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WALOW Browser - Multi-Tab System</title>
    <style>
        :root {
            --bg-deep: #050b14;
            --surface: #0a1628;
            --surface-hover: #13243e;
            --neon-cyan: #00f0ff;
            --neon-purple: #9d00ff;
            --text-main: #f0f4f8;
            --text-muted: #8ba2b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* شريط التبويبات العلوي */
        .tabs-bar {
            background: #03070d;
            display: flex;
            align-items: center;
            padding: 8px 10px 0 10px;
            overflow-x: auto;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            scrollbar-width: thin;
        }

        .tab {
            background: var(--surface);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 140px;
            max-width: 200px;
            cursor: pointer;
            margin-left: 5px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: none;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: var(--bg-deep);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 -4px 12px rgba(0, 240, 255, 0.15);
        }

        .tab-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.85rem;
        }

        .close-tab {
            font-size: 0.9rem;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }

        .close-tab:hover {
            background: rgba(255, 0, 0, 0.3);
            color: #fff;
        }

        .add-tab-btn {
            background: var(--surface);
            color: var(--neon-cyan);
            border: 1px dashed var(--neon-cyan);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            margin-left: 10px;
            margin-bottom: 4px;
        }

        .add-tab-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }

        /* شريط العنوان والتحكم */
        header {
            padding: 12px 20px;
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .search-container {
            flex: 1;
            background: var(--bg-deep);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 0.9rem;
            text-align: right;
        }

        .go-btn {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        /* منطقة المحتوى الرئيسية */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .welcome-box {
            background: var(--surface);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.05);
        }

        .welcome-box h2 {
            color: var(--neon-cyan);
            margin-bottom: 10px;
        }

        .welcome-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- شريط التبويبات -->
    <div class="tabs-bar" id="tabsBar">
        <div class="tab active" onclick="selectTab(this)" data-id="1">
            <span class="tab-title">تبويب جديد 1</span>
            <span class="close-tab" onclick="closeTab(event, this)">×</span>
        </div>
        <button class="add-tab-btn" onclick="addNewTab()" title="فتح تبويب جديد">+</button>
    </div>

    <!-- شريط العنوان -->
    <header>
        <div class="logo">WALOW BROWSER</div>
        <div class="search-container">
            <input type="text" id="urlInput" class="search-input" placeholder="أدخل عنوان URL أو ابحث...">
        </div>
        <button class="go-btn" onclick="loadUrl()">ذهاب</button>
    </header>

    <!-- منطقة عرض التبويبات -->
    <main>
        <div class="welcome-box">
            <h2>مرحباً بك في WALOW Browser</h2>
            <p>يمكنك الآن فتح العشرات من التبويبات وإدارتها بحرية تامة من الشريط العلوي!</p>
        </div>
    </main>

    <script>
        let tabCount = 1;

        function addNewTab() {
            tabCount++;
            const tabsBar = document.getElementById('tabsBar');
            const addBtn = document.querySelector('.add-tab-btn');

            // إزالة التحديد عن التبويبات القديمة
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

            // إنشاء تبويب جديد
            const newTab = document.createElement('div');
            newTab.className = 'tab active';
            newTab.setAttribute('onclick', 'selectTab(this)');
            newTab.setAttribute('data-id', tabCount);
            newTab.innerHTML = `
                <span class="tab-title">تبويب جديد ${tabCount}</span>
                <span class="close-tab" onclick="closeTab(event, this)">×</span>
            `;

            tabsBar.insertBefore(newTab, addBtn);
            document.getElementById('urlInput').value = '';
        }

        function selectTab(tabElement) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tabElement.classList.add('active');
        }

        function closeTab(event, closeBtn) {
            event.stopPropagation();
            const tab = closeBtn.parentElement;
            const tabs = document.querySelectorAll('.tab');
            
            if (tabs.length > 1) {
                if (tab.classList.contains('active')) {
                    const nextTab = tab.nextElementSibling?.classList.contains('tab') ? tab.nextElementSibling : tab.previousElementSibling;
                    if (nextTab) selectTab(nextTab);
                }
                tab.remove();
            }
        }

        function loadUrl() {
            const url = document.getElementById('urlInput').value;
            const activeTab = document.querySelector('.tab.active .tab-title');
            if (url && activeTab) {
                activeTab.textContent = url;
            }
        }
    </script>
</body>
</html>
